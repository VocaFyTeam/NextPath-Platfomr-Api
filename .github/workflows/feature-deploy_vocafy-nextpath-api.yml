# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions


name: Build, migrate and deploy NextPath API

on:
  push:
    branches:
      - 'deploy'
      - 'feature/deploy'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.14

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Build
        run: dotnet build ./VocaFy.NextPath.Platform.csproj --configuration Release

      - name: Publish application
        run: dotnet publish ./VocaFy.NextPath.Platform.csproj -c Release -o ./publish

      - name: Restore Linux dependencies
        run: dotnet restore ./VocaFy.NextPath.Platform.csproj --runtime linux-x64

      - name: Generate migration bundle
        run: |
          dotnet ef migrations bundle \
            --project ./VocaFy.NextPath.Platform.csproj \
            --configuration Release \
            --self-contained \
            --runtime linux-x64 \
            --output ./efbundle

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Upload migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: migration-bundle
          path: ./efbundle

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download application
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Download migration bundle
        uses: actions/download-artifact@v4
        with:
          name: migration-bundle
          path: ./migration

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8BF3B0E68C444FBDAFF529B8C037D3EA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_38E927063FCF4FBB97BE23257CCBED0E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FC3E7E78423D441291529EDE940B2CDF }}

      - name: Apply database migrations
        run: chmod +x ./migration/efbundle && ./migration/efbundle
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_MYSQL_CONNECTION_STRING }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'vocafy-nextpath-api'
          slot-name: 'Production'
          package: .
